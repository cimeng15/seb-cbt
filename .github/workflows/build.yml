name: Build SEB (CBT Edition)

on:
  push:
    branches: [ master, main, cbt-integration ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  SOLUTION: SafeExamBrowser.sln
  CONFIGURATION: Release

jobs:
  build:
    name: Build (x64 + x86 + installer bundle)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Install WiX Toolset (for the installer projects)
        shell: pwsh
        run: |
          # WiX Toolset v3 is usually pre-installed on windows-latest; install only if missing.
          $wix = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*\bin\candle.exe" -ErrorAction SilentlyContinue
          if (-not $wix) {
            choco install wixtoolset --version=3.14.1 -y --no-progress --force
          } else {
            Write-Host "WiX Toolset already present: $($wix[0].FullName)"
          }
          $bin = (Get-ChildItem "C:\Program Files (x86)\WiX Toolset*\bin" -Directory | Select-Object -First 1).FullName
          if ($bin) { $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }

      - name: Restore NuGet packages
        run: nuget restore ${{ env.SOLUTION }}

      # Build sequentially and in this exact order: the SetupBundle project (Release|x86) packs
      # BOTH the x64 and the x86 Setup MSI, so the x64 installer must already exist.
      # Do NOT use /m: the WiX projects harvest their dependencies in a pre-build event.
      - name: Build x64
        run: msbuild ${{ env.SOLUTION }} /verbosity:minimal /property:langversion=latest /property:Configuration=${{ env.CONFIGURATION }} /property:Platform=x64

      - name: Build x86 (also produces the installer bundle)
        run: msbuild ${{ env.SOLUTION }} /verbosity:minimal /property:langversion=latest /property:Configuration=${{ env.CONFIGURATION }} /property:Platform=x86

      - name: Upload x64 MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: SEB-CBT-Setup-x64
          path: Setup/bin/x64/${{ env.CONFIGURATION }}/Setup.msi
          if-no-files-found: warn

      - name: Upload x86 MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: SEB-CBT-Setup-x86
          path: Setup/bin/x86/${{ env.CONFIGURATION }}/Setup.msi
          if-no-files-found: warn

      - name: Upload installer bundle (EXE)
        uses: actions/upload-artifact@v4
        with:
          name: SEB-CBT-SetupBundle
          path: SetupBundle/bin/x86/${{ env.CONFIGURATION }}/SetupBundle.exe
          if-no-files-found: warn

      - name: Upload client binaries (x64)
        uses: actions/upload-artifact@v4
        with:
          name: SEB-CBT-Client-x64
          path: SafeExamBrowser.Client/bin/x64/${{ env.CONFIGURATION }}/
          if-no-files-found: warn
