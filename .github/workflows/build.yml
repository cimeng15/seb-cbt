name: Build SEB (CBT Edition)

on:
  push:
    branches: [ master, main, cbt-integration ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  SOLUTION: SafeExamBrowser.sln
  CONFIGURATION: Release

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        platform: [ x64, x86 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Install WiX Toolset (for the installer project)
        shell: pwsh
        run: |
          choco install wixtoolset --version=3.14.1 -y --no-progress
          echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Restore NuGet packages
        run: nuget restore ${{ env.SOLUTION }}

      - name: Build solution
        run: msbuild ${{ env.SOLUTION }} /m /verbosity:minimal /property:langversion=latest /property:Configuration=${{ env.CONFIGURATION }} /property:Platform=${{ matrix.platform }}

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: SEB-CBT-Setup-${{ matrix.platform }}
          path: Setup/bin/${{ matrix.platform }}/${{ env.CONFIGURATION }}/Setup.msi
          if-no-files-found: warn

      - name: Upload client binaries
        uses: actions/upload-artifact@v4
        with:
          name: SEB-CBT-Client-${{ matrix.platform }}
          path: SafeExamBrowser.Client/bin/${{ matrix.platform }}/${{ env.CONFIGURATION }}/
          if-no-files-found: warn
