name: Build SEB (CBT Edition)

on:
  push:
    branches: [ master, main, cbt-integration ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  SOLUTION: SafeExamBrowser.sln
  CONFIGURATION: Release

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        platform: [ x64, x86 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Install WiX Toolset (for the installer project)
        shell: pwsh
        run: |
          # WiX Toolset v3 is usually pre-installed on windows-latest; install only if missing.
          $wix = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*\bin\candle.exe" -ErrorAction SilentlyContinue
          if (-not $wix) {
            choco install wixtoolset --version=3.14.1 -y --no-progress --force
          } else {
            Write-Host "WiX Toolset already present: $($wix[0].FullName)"
          }
          $bin = (Get-ChildItem "C:\Program Files (x86)\WiX Toolset*\bin" -Directory | Select-Object -First 1).FullName
          if ($bin) { $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
          Get-Command candle.exe -ErrorAction SilentlyContinue | Out-Null

      - name: Restore NuGet packages
        run: nuget restore ${{ env.SOLUTION }}

      - name: Build solution
        # NOTE: do NOT use /m (parallel). The WiX installer projects run heat.exe in a pre-build
        # event which requires the referenced projects' output to already exist; parallel builds
        # can start Setup before its dependencies have finished.
        run: msbuild ${{ env.SOLUTION }} /verbosity:minimal /property:langversion=latest /property:Configuration=${{ env.CONFIGURATION }} /property:Platform=${{ matrix.platform }}

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: SEB-CBT-Setup-${{ matrix.platform }}
          path: Setup/bin/${{ matrix.platform }}/${{ env.CONFIGURATION }}/Setup.msi
          if-no-files-found: warn

      - name: Upload client binaries
        uses: actions/upload-artifact@v4
        with:
          name: SEB-CBT-Client-${{ matrix.platform }}
          path: SafeExamBrowser.Client/bin/${{ matrix.platform }}/${{ env.CONFIGURATION }}/
          if-no-files-found: warn
